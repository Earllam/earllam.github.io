            display: -webkit-flex;
            display: -ms-flexbox;

            -webkit-box-align: center;
            -webkit-align-items: center;
            -ms-flex-align: center;
            align-items: center;
            -webkit-box-pack: center;
            -webkit-justify-content: center;
            -ms-flex-pack: center;
            justify-content: center;
            flex-direction: column;
        }

        .beian>.gov-url {
            font-size: 14px;
            font-weight: 200;
            color: #666;
            text-decoration: none;
        }

        .police-gov-url {
            font-size: 14px;
            font-weight: 200;
            margin-bottom: 26px;
            color: #666;
            text-decoration: none;
            display: flex;
            -webkit-box-pack: center;
            -webkit-justify-content: center;
            -ms-flex-pack: center;
            justify-content: center;
            -webkit-box-align: center;
            -webkit-align-items: center;
            -ms-flex-align: center;
            align-items: center;
